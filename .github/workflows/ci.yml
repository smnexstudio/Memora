# Checks every push and pull request: the Gradle wrapper is genuine, the app builds, the unit
# tests pass and Android lint finds no errors. Nothing here can sign or publish anything.
#
# Actions are pinned to commit SHAs (the tag is in the comment) so a moved or hijacked tag
# can't change what runs. Outdated or vulnerable dependencies are reported quarterly as an issue
# (.github/workflows/dependency-report.yml); updates are made by hand.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the Gradle wrapper is the real one
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Build, unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleDebug testDebugUnitTest lintDebug

      - name: Keep the lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
