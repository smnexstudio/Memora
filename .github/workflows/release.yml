# Builds the signed release APK and publishes it as a GitHub release.
#
# Release:  git tag v1.0.0 && git push origin v1.0.0
# Or run it by hand from the Actions tab with a version number.
#
# Signing: add these repository secrets to sign with your own release key
#   MEMORA_KEYSTORE_BASE64   the .jks file, base64-encoded (base64 -w0 memora.jks)
#   MEMORA_KEYSTORE_PASSWORD
#   MEMORA_KEY_ALIAS
#   MEMORA_KEY_PASSWORD
# Without them the release stops: it is never signed with the shared debug key.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then v="$INPUT_VERSION"; else v="${GITHUB_REF_NAME#v}"; fi
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must look like 1.0.0 (got '$v')"; exit 1
          fi
          IFS=. read -r major minor patch <<< "$v"
          # 1.0.0 -> 10000, 1.2.3 -> 10203: always higher for a higher version, and above the earlier test builds (code 2).
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Version $v (code $code)"

      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MEMORA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/memora.jks"
            echo "MEMORA_KEYSTORE_FILE=$RUNNER_TEMP/memora.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key from secrets."
          else
            echo "::error::No MEMORA_KEYSTORE_BASE64 secret. Add the four MEMORA_* signing secrets (see docs/DEVELOPMENT.md) and run the release again."
            exit 1
          fi

      - name: Run the unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain testDebugUnitTest

      - name: Build the release APK
        env:
          MEMORA_KEYSTORE_PASSWORD: ${{ secrets.MEMORA_KEYSTORE_PASSWORD }}
          MEMORA_KEY_ALIAS: ${{ secrets.MEMORA_KEY_ALIAS }}
          MEMORA_KEY_PASSWORD: ${{ secrets.MEMORA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # --console=plain prints each task as it runs. The first run is quiet for a few
          # minutes while it downloads Gradle, the Android plugin and the Android SDK.
          ./gradlew --no-daemon --console=plain --stacktrace assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}

      - name: Name the APK and its checksum
        id: apk
        run: |
          name="Memora-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          sha256sum "$name" > "$name.sha256"
          echo "file=$name" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          v="${{ steps.version.outputs.name }}"
          # The lines under "## [v]" up to the next "## [" heading.
          awk -v v="$v" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on && index($0, "[") == 1 && index($0, "]: ") > 0 { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ] && grep -q '[^[:space:]]' notes.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No section for $v in CHANGELOG.md; using generated notes."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/memora.jks"

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Memora ${{ steps.version.outputs.name }}
          body_path: ${{ steps.notes.outputs.found == 'true' && 'notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
